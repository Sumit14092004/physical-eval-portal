<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Physical Evaluation Portal</title>
    <script type="text/javascript">
      // GitHub Pages has no server-side rewrite, so it 404s on any route
      // other than "/" when someone refreshes or links directly to e.g.
      // /merit. This is the standard workaround (rafgraph/spa-github-pages):
      // GitHub Pages serves this 404.html for the unmatched route, which
      // encodes the path into a query string and redirects to index.html;
      // the matching script there decodes it and hands off to React Router.
      //
      // pathSegmentsToKeep = 1 assumes a GitHub Pages *project* site
      // (username.github.io/REPO_NAME/...). If deploying to a custom
      // domain served from the root instead, change this to 0.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
