name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Import the app (catches wiring errors, not just syntax)
        working-directory: backend
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from app.main import app
          assert len(app.routes) > 20, 'Fewer routes than expected -- something failed to register'
          print(f'OK -- {len(app.routes)} routes registered')
          "

      - name: Import Celery tasks
        working-directory: backend
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from app.tasks.ranking_tasks import (
              recompute_final_exam_ranks_task,
              recompute_monthly_ranks_task,
              recompute_quarterly_ranks_task,
          )
          print('OK -- Celery tasks import cleanly')
          "

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Production build
        working-directory: frontend
        run: npm run build

  # Builds both Docker images to confirm the Dockerfiles themselves are
  # valid -- doesn't push anywhere yet. Wire up a registry + deploy step
  # here once you've picked a hosting target (see README "Deployment").
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t physical-eval-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t physical-eval-frontend:ci ./frontend
