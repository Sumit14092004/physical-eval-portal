name: Deploy frontend to GitHub Pages

# Before this works: in the repo's Settings > Pages, set "Source" to
# "GitHub Actions" (not "Deploy from a branch"). Also add two repo
# secrets (Settings > Secrets and variables > Actions):
#   VITE_API_BASE_URL  -- your Render backend URL + /api/v1,
#                          e.g. https://physical-eval-backend.onrender.com/api/v1
#   VITE_BASE_PATH_REPO -- your repo name, e.g. physical-eval-portal
#                          (used to build the /REPO_NAME/ base path)

on:
  push:
    branches: [main]
    paths: ["frontend/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_BASE_PATH: /${{ secrets.VITE_BASE_PATH_REPO }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
